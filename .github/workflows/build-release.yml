name: Build release packages

# Releases (version bump, tag, GitHub Release) only happen on push to main.
# Pushes to ci/** branches, pull requests and manual runs build and upload
# the packages as workflow artifacts without touching versions or tags.
on:
  push:
    branches: [ "main", "ci/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # Runs before anything is versioned, tagged, packaged or released: a failing
  # test stops the whole pipeline.
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET 6 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x

    # CI only, see the Windows job.
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Show .NET SDK
      run: dotnet --version

    # The solution filter skips the WiX packaging project, which only builds on Windows.
    - name: Run tests
      run: dotnet test PTZJoystickControl.App.slnf

  bump-version:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      VERSION: ${{ steps.version-select.outputs.VERSION }}
      SHA: ${{ steps.version-select.outputs.SHA }}

    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump version
        if: ${{ env.IS_RELEASE == 'true' && github.run_attempt == 1 }}
        # Increments the third version part, sets the fourth to the run number,
        # and commits the change back as the user who pushed.
        run: |
          current=$(grep -oP '<Version>\K[^<]+' Gui/Gui.csproj)
          IFS=. read -r major minor patch _ <<< "$current"
          next="$major.$minor.$((patch + 1)).${{ github.run_number }}"
          echo "Version: $current -> $next"
          sed -i "s|<Version>$current</Version>|<Version>$next</Version>|" Gui/Gui.csproj
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -am "Bump version to $next"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag version in git
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          version=$(grep -oP '<Version>\K(.*)(?=\.\d+</Version>)' Gui/Gui.csproj)
          git tag "v$version"
          git push origin "v$version"

      # The build jobs check out this commit, so on main they build the bumped
      # version rather than the commit that triggered the run.
      - name: Set version output
        id: version-select
        run: |
          version=$(grep -oP '<Version>\K(.*)(?=\.\d+</Version>)' Gui/Gui.csproj)
          echo "Version: ${version}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          # Only on release runs; elsewhere checkout uses the event's default ref.
          if [ "$IS_RELEASE" = "true" ]; then
            echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build-windows-packeges:
    needs: bump-version
    runs-on: windows-latest
    strategy:
       fail-fast: false
       matrix:
          arch: [x86, x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump-version.outputs.SHA }}

    - name: Install .NET 6 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x

    # Runners ship newer SDKs that reject the win7-* RIDs used below and in
    # Packaging/Windows/MainProgram.wxs. Pin this run to the SDK just installed.
    # CI only: the repo has no global.json so local builds use any SDK.
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Show .NET SDK
      run: dotnet --version

    - name: Publish application
      run: dotnet publish Gui/Gui.csproj -c PublishRelease -r $env:Runtime --self-contained
      env:
        Runtime: ${{ format('win7-{0}', matrix.arch) }}

    ## Decode the base 64 encoded pfx and save the Signing_Certificate
    #- name: Decode the pfx
    #  run: |
    #    $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
    #    $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
    #    [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Create the app package by building and packaging the Windows Application Packaging project
    - name: Create msi package
      run: dotnet build Packaging/Windows/Windows.wixproj -c PublishRelease -p:OutputName=$env:OutputName -o Packaging/Windows/Packages -p:platform=$env:Arch #-p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx -p:PackageCertificatePassword=${{ secrets.Pfx_Key }}
      env:
        Arch: ${{ matrix.arch }}
        OutputName: ${{ format('PTZJoystickControl_v{0}_win_{1}', needs.bump-version.outputs.VERSION, matrix.arch) }}

    ## Remove the pfx
    #- name: Remove the pfx
    #  run: Remove-Item -path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx

    - name: Upload build artifacts (msi package)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('msi-win-{0}', matrix.arch) }}
        path: Packaging/Windows/Packages/**/*.msi
        if-no-files-found: error

    - name: GH Release
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v3
      with:
        prerelease: true
        tag_name: v${{ needs.bump-version.outputs.VERSION }}
        files: Packaging/Windows/Packages/**/*.msi

  build-macos-packeges:
    needs: bump-version
    # macos-latest is arm64; the x64 app is cross-published and runs under Rosetta.
    runs-on: macos-latest

    env:
      OutputName: ${{ format('PTZJoystickControl_v{0}_osx_x64', needs.bump-version.outputs.VERSION) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump-version.outputs.SHA }}

    - name: Setup .NET 6 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x

    # CI only, see the Windows job.
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Show .NET SDK
      run: dotnet --version

    - name: Build
      run: dotnet publish Gui/Gui.csproj -c PublishRelease -r osx-x64 --self-contained #/p:PublishSingleFile=true /p:PublishTrimmed=true

    - name: Install Dependencies
      run: |
        brew install create-dmg

    - name: Copy Files into app structure
      run: |
        mkdir -p dist/PTZJoystickControl.app/Contents/MacOS
        mkdir -p dist/PTZJoystickControl.app/Contents/Resources
        cp Gui/bin/PublishRelease/net6.0/osx-x64/publish/* dist/PTZJoystickControl.app/Contents/MacOS
        cp Packaging/Mac/icon.icns dist/PTZJoystickControl.app/Contents/Resources/
        cp Packaging/Mac/Info.plist dist/PTZJoystickControl.app/Contents/

    - name: Update Info.plist version
      run: |
        plist=dist/PTZJoystickControl.app/Contents/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist"
      env:
        VERSION: ${{ needs.bump-version.outputs.VERSION }}

    - name: Create Installer
      run: |
        create-dmg \
          --volname "PTZJoystickControl.app" \
          --volicon "dist/PTZJoystickControl.app/Contents/Resources/icon.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "PTZJoystickControl.app" 200 190 \
          --hide-extension "PTZJoystickControl.app" \
          --app-drop-link 600 185 \
          "$OutputName.dmg" \
          dist/PTZJoystickControl.app

    - name: Upload build artifacts (dmg package)
      uses: actions/upload-artifact@v7
      with:
          name: dmg-osx-x64
          path: "*.dmg"
          if-no-files-found: error

    - name: GH Release
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v3
      with:
          prerelease: true
          tag_name: v${{ needs.bump-version.outputs.VERSION }}
          files: "*.dmg"
