name: Build release packages

# Releases (version bump, tag, GitHub Release) only happen on push to main.
# Pushes to ci/** branches, pull requests and manual runs build and upload
# the packages as workflow artifacts without touching versions or tags.
on:
  push:
    branches: [ "main", "ci/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # Runs before anything is versioned, tagged, packaged or released: a failing
  # test stops the whole pipeline.
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET 10 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # CI only, see the Windows job.
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Show .NET SDK
      run: dotnet --version

    - name: Run tests
      run: dotnet test PTZJoystickControl.sln

  bump-version:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      VERSION: ${{ steps.version-select.outputs.VERSION }}
      SHA: ${{ steps.version-select.outputs.SHA }}

    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so a re-run can find the bump commit an earlier
          # attempt pushed to main.
          fetch-depth: 0

      # Safe to re-run ("Re-run failed jobs" / "Re-run all jobs"). A re-run
      # keeps the same triggering commit and run number, so the bumped version
      # is known up front. If an earlier attempt already pushed that bump
      # commit, check it out and reuse it; otherwise bump and push now.
      - name: Bump version
        if: ${{ env.IS_RELEASE == 'true' }}
        # Increments the third version part, sets the fourth to the run number,
        # and commits the change back as the user who pushed.
        run: |
          current=$(grep -oP '<Version>\K[^<]+' Gui/Gui.csproj)
          IFS=. read -r major minor patch _ <<< "$current"
          next="$major.$minor.$((patch + 1)).${{ github.run_number }}"
          subject="Bump version to $next"
          echo "Version: $current -> $next"

          git fetch origin "${{ github.ref_name }}"
          # The bump commit for this run: a child of the triggering commit
          # with exactly this subject.
          existing=$(git log --format='%H %P %s' "$GITHUB_SHA..FETCH_HEAD" \
            | awk -v parent="$GITHUB_SHA" -v subject="$subject" \
                '$2 == parent && substr($0, length($1) + length($2) + 3) == subject { print $1 }')

          if [ -n "$existing" ]; then
            echo "Reusing bump commit $existing from an earlier attempt"
            git checkout --detach "$existing"
          else
            sed -i "s|<Version>$current</Version>|<Version>$next</Version>|" Gui/Gui.csproj
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
            git commit -am "$subject"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Idempotent: creates the tag on the bump commit, accepts a tag an
      # earlier attempt already put there, and stops if the tag points
      # anywhere else (that would publish over another release).
      - name: Tag version in git
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          version=$(grep -oP '<Version>\K(.*)(?=\.\d+</Version>)' Gui/Gui.csproj)
          tag="v$version"
          head=$(git rev-parse HEAD)
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -z "$tagged" ]; then
            git tag "$tag" "$head"
            git push origin "$tag"
          elif [ "$tagged" = "$head" ]; then
            echo "Tag $tag already points at $head (earlier attempt); not pushing"
          else
            echo "::error::Tag $tag already exists on $tagged, not on this run's bump commit $head"
            exit 1
          fi

      # The build jobs check out this commit, so on main they build the bumped
      # version rather than the commit that triggered the run.
      - name: Set version output
        id: version-select
        run: |
          version=$(grep -oP '<Version>\K(.*)(?=\.\d+</Version>)' Gui/Gui.csproj)
          echo "Version: ${version}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          # Only on release runs; elsewhere checkout uses the event's default ref.
          if [ "$IS_RELEASE" = "true" ]; then
            echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build-windows-packeges:
    needs: bump-version
    runs-on: windows-latest
    strategy:
       fail-fast: false
       matrix:
          arch: [x86, x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump-version.outputs.SHA }}

    - name: Install .NET 10 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Runners may ship newer SDKs than the LTS. Pin this run to the SDK just
    # installed so packages are built with the .NET 10 SDK. CI only: the repo
    # has no global.json so local builds use any SDK that supports net10.0.
    # The win7-* RIDs below need the legacy RID graph, which
    # Directory.Build.props turns on (UseRidGraph).
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Show .NET SDK
      run: dotnet --version

    # Single file: Gui.exe bundles the .NET runtime and every managed assembly.
    # The native DLLs (av_libglesv2, SDL2, libSkiaSharp, libHarfBuzzSharp) stay
    # beside the exe and load from the app folder, as they did from the MSI's
    # install folder. IncludeNativeLibrariesForSelfExtract is left off on
    # purpose: it unpacks them to %TEMP% on first run, one more thing that can
    # fail on the show PC (antivirus, temp clean-up).
    - name: Publish application
      run: dotnet publish Gui/Gui.csproj -c PublishRelease -r $env:Runtime --self-contained -p:PublishSingleFile=true -o publish
      env:
        Runtime: ${{ format('win7-{0}', matrix.arch) }}

    - name: List published files
      run: Get-ChildItem publish

    # The zip holds the publish folder's files at its root (Gui.exe, the native
    # DLLs and the pdbs, which keep line numbers in logged stack traces).
    - name: Create zip package
      run: Compress-Archive -Path publish\* -DestinationPath "$env:OutputName.zip"
      env:
        OutputName: ${{ format('PTZJoystickControl_v{0}_win_{1}', needs.bump-version.outputs.VERSION, matrix.arch) }}

    - name: Upload build artifacts (zip package)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('zip-win-{0}', matrix.arch) }}
        path: "*.zip"
        if-no-files-found: error

  build-macos-packeges:
    needs: bump-version
    # macos-latest is arm64; the x64 app is cross-published and runs under Rosetta.
    runs-on: macos-latest

    env:
      OutputName: ${{ format('PTZJoystickControl_v{0}_osx_x64', needs.bump-version.outputs.VERSION) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump-version.outputs.SHA }}

    - name: Setup .NET 10 SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # CI only, see the Windows job.
    - name: Pin .NET SDK for this run
      shell: bash
      run: printf '{"sdk":{"version":"%s"}}\n' "${{ steps.setup-dotnet.outputs.dotnet-version }}" > global.json

    - name: Show .NET SDK
      run: dotnet --version

    - name: Build
      run: dotnet publish Gui/Gui.csproj -c PublishRelease -r osx-x64 --self-contained #/p:PublishSingleFile=true /p:PublishTrimmed=true

    - name: Install Dependencies
      run: |
        brew install create-dmg

    - name: Copy Files into app structure
      run: |
        mkdir -p dist/PTZJoystickControl.app/Contents/MacOS
        mkdir -p dist/PTZJoystickControl.app/Contents/Resources
        cp Gui/bin/PublishRelease/net10.0/osx-x64/publish/* dist/PTZJoystickControl.app/Contents/MacOS
        cp Packaging/Mac/icon.icns dist/PTZJoystickControl.app/Contents/Resources/
        cp Packaging/Mac/Info.plist dist/PTZJoystickControl.app/Contents/

    - name: Update Info.plist version
      run: |
        plist=dist/PTZJoystickControl.app/Contents/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist"
      env:
        VERSION: ${{ needs.bump-version.outputs.VERSION }}

    - name: Create Installer
      run: |
        create-dmg \
          --volname "PTZJoystickControl.app" \
          --volicon "dist/PTZJoystickControl.app/Contents/Resources/icon.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "PTZJoystickControl.app" 200 190 \
          --hide-extension "PTZJoystickControl.app" \
          --app-drop-link 600 185 \
          "$OutputName.dmg" \
          dist/PTZJoystickControl.app

    - name: Upload build artifacts (dmg package)
      uses: actions/upload-artifact@v7
      with:
          name: dmg-osx-x64
          path: "*.dmg"
          if-no-files-found: error

  # The only job that touches the GitHub Release. It runs after every build
  # job has succeeded (a failed build skips it, so no partial release) and
  # publishes all packages in one go instead of three jobs racing on one tag.
  release:
    needs: [bump-version, build-windows-packeges, build-macos-packeges]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        path: packages
        merge-multiple: true

    - name: List packages
      run: ls -lR packages

    - name: GH Release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: true
        tag_name: v${{ needs.bump-version.outputs.VERSION }}
        fail_on_unmatched_files: true
        files: |
          packages/**/*_win_x86.zip
          packages/**/*_win_x64.zip
          packages/**/*.dmg
